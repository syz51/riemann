<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>The proof of the Riemann hypothesis, step by step</title>
    <script>
      try {
        var t = localStorage.getItem("riemann-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
      try {
        var q = new URLSearchParams(location.search).get("lang");
        var l = q || localStorage.getItem("riemann-lang") || navigator.language || "en";
        if (l.toLowerCase().indexOf("zh") === 0) {
          document.documentElement.lang = "zh-Hans";
          document.title = "一步步读懂黎曼猜想的证明";
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
