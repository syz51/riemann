name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Job ids are the required status check names on `main`: rename them only together with
# the ruleset.
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: site/package.json
      # `packageManager` in site/package.json is the Bun version; vercel.json must install
      # with the same one.
      - name: Check vercel.json uses the same Bun
        run: |
          want="$(jq -r '.packageManager | ltrimstr("bun@")' package.json)"
          grep -q "bun@${want} " ../vercel.json \
            || { echo "::error file=vercel.json::installCommand does not use bun@${want}, the packageManager in site/package.json"; exit 1; }
      - run: bun install --frozen-lockfile
      - run: bun run verify
